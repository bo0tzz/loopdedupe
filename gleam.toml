name = "loopdedupe"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.0 and < 7.0.0"
wisp = ">= 2.1.0 and < 3.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
cigogne = ">= 5.0.4 and < 6.0.0"
pog = ">= 4.1.0 and < 5.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_time = ">= 1.5.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
snag = ">= 1.2.0 and < 2.0.0"
m25 = { git = "https://github.com/bo0tzz/m25.git", ref = "cigogne" }
gleam_httpc = ">= 5.0.0 and < 6.0.0"
logging = ">= 1.3.0 and < 2.0.0"
# Pinned to halostatue's PR #2 branch (bigmoves/squall#2) which loosens
# squall's stdlib pin from `< 0.66.0` to `< 2.0.0`. That's the constraint
# that was blocking us from taking gleam_stdlib 1.x / mist 6 / wisp 2.2.2
# / squirrel 4.7. Swap back to the hex release when the PR lands upstream.
squall = { git = "https://github.com/halostatue/squall.git", ref = "3ad5ef88ff37faa1883d3f66cef7749034a0f2f2" }
gleam_regexp = ">= 1.1.1 and < 2.0.0"
jose = ">= 1.11.12 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
squirrel = ">= 4.6.0 and < 5.0.0"
